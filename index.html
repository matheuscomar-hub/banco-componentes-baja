
<script>
  const nomes = {
    "codigo": "Código",
    "nome do componente": "Componente",
    "subsistema": "Subsistema",
    "material": "Material",
    "fabricacao/aquisicao": "Fabricação / Aquisição",
    "como funciona (breve descricao)": "Função",
    "foto (nome do arquivo ou link)": "Foto",
    "fornecedor/local de fabricacao": "Fornecedor / Local",
    "processo de fabricacao": "Processo de fabricação",
    "observacoes": "Observações"
  };

  const camposPermitidos = [
    "codigo",
    "nome do componente",
    "subsistema",
    "material",
    "fabricacao/aquisicao",
    "como funciona (breve descricao)",
    "foto (nome do arquivo ou link)",
    "fornecedor/local de fabricacao",
    "processo de fabricacao",
    "observacoes"
  ];

  function normalizar(texto) {
    return String(texto || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();
  }

  function normalizarCodigo(texto) {
    return String(texto || "")
      .toUpperCase()
      .replace(/\s+/g, "")
      .replace(/-/g, "")
      .trim();
  }

  function extrairIdGoogleDrive(url) {
    const link = String(url || "").trim();
    const padroes = [
      /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
      /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
      /[?&]id=([a-zA-Z0-9_-]+)/
    ];

    for (const padrao of padroes) {
      const match = link.match(padrao);
      if (match) return match[1];
    }

    return null;
  }

  function converterLinkGoogleDrive(url) {
    const link = String(url || "").trim();
    if (!link) return "";

    const id = extrairIdGoogleDrive(link);

    if (id) {
      return "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(id) + "&sz=w1200";
    }

    return /^https?:\/\//i.test(link) ? link : "";
  }

  function obterLinkParaAbrir(url) {
    const link = String(url || "").trim();
    const id = extrairIdGoogleDrive(link);

    return id
      ? "https://drive.google.com/file/d/" +
          encodeURIComponent(id) + "/view"
      : link;
  }

  document.getElementById("formBusca").addEventListener("submit", function(event) {
    event.preventDefault();

    const codigo = document.getElementById("codigo").value.trim();
    const mensagem = document.getElementById("mensagem");
    const resultado = document.getElementById("resultado");
    const botao = document.getElementById("botao");

    resultado.replaceChildren();

    if (!codigo) {
      mensagem.textContent = "Digite o código de um componente.";
      return;
    }

    mensagem.textContent = "Consultando a planilha...";
    botao.disabled = true;

    const callbackName =
      "bajaCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");
    let finalizado = false;

    function finalizar() {
      finalizado = true;
      delete window[callbackName];
      script.remove();
      botao.disabled = false;
    }

    window[callbackName] = function(resposta) {
      finalizar();

      if (!resposta || resposta.status === "error" || !resposta.table) {
        mensagem.textContent =
          "Não foi possível ler a planilha. Verifique se ela está publicada.";
        return;
      }

      const tabela = resposta.table;
      const colunas = tabela.cols || [];
      const linhas = tabela.rows || [];

      const cabecalhos = colunas.map(coluna =>
        normalizar(coluna.label || coluna.id || "")
      );

      const indiceCodigo = cabecalhos.findIndex(c =>
        c === "codigo" || c === "código"
      );

      if (indiceCodigo < 0) {
        mensagem.textContent =
          "Não encontrei a coluna Código na primeira aba publicada.";
        return;
      }

      const codigoBusca = normalizarCodigo(codigo);
      let ficha = null;

      for (const linha of linhas) {
        const celulas = linha.c || [];

        const valorCodigo = celulas[indiceCodigo]
          ? (celulas[indiceCodigo].f ?? celulas[indiceCodigo].v ?? "")
          : "";

        if (normalizarCodigo(valorCodigo) !== codigoBusca) continue;

        ficha = {};

        cabecalhos.forEach((cabecalho, indice) => {
          if (!cabecalho) return;

          const celula = celulas[indice];
          const valor = celula
            ? String(celula.f ?? celula.v ?? "").trim()
            : "";

          if (valor && camposPermitidos.includes(cabecalho)) {
            ficha[cabecalho] = valor;
          }
        });

        break;
      }

      if (!ficha) {
        mensagem.textContent =
          "Componente não encontrado na primeira aba. Confira o código.";
        return;
      }

      mensagem.textContent = "Componente encontrado.";

      const cartao = document.createElement("section");
      cartao.className = "ficha";

      const titulo = document.createElement("h3");
      titulo.textContent =
        ficha["nome do componente"] || "Ficha do componente";
      cartao.appendChild(titulo);

      Object.entries(ficha).forEach(function([chave, valor]) {
        const linha = document.createElement("div");
        linha.className = "campo";

        const rotulo = document.createElement("strong");
        rotulo.textContent = nomes[chave] || chave;
        linha.appendChild(rotulo);

        if (chave === "foto (nome do arquivo ou link)") {
          const urlImagem = converterLinkGoogleDrive(valor);

          if (urlImagem) {
            const img = document.createElement("img");
            img.className = "foto-componente";
            img.alt = ficha["nome do componente"] || "Foto do componente";
            img.loading = "lazy";

            img.onerror = function() {
              img.remove();
              const aviso = document.createElement("p");
              aviso.className = "aviso-foto";
              aviso.textContent =
                "Não foi possível exibir a foto. Abra o arquivo pelo link abaixo.";
              linha.appendChild(aviso);
            };

            img.src = urlImagem;
            linha.appendChild(img);

            const link = document.createElement("a");
            link.className = "link-foto";
            link.href = obterLinkParaAbrir(valor);
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Abrir foto em uma nova aba";
            linha.appendChild(link);
          } else {
            const texto = document.createElement("span");
            texto.textContent = "Foto não cadastrada.";
            linha.appendChild(texto);
          }
        } else {
          const texto = document.createElement("span");
          texto.textContent = valor;
          linha.appendChild(texto);
        }

        cartao.appendChild(linha);
      });

      resultado.appendChild(cartao);
    };

    script.onerror = function() {
      if (finalizado) return;
      finalizar();
      mensagem.textContent =
        "Não foi possível acessar os dados publicados. Confira a publicação da planilha.";
    };

    const planilhaPublicada =
      "https://docs.google.com/spreadsheets/d/e/" +
      "2PACX-1vSfiFPKF0XoddHsIkNxgFGCwjQFpeHJSm78rD5CxITdio-TVRrz0fQsVG0rxYzUVNa3rlq5sRwUFqJp";

    script.src = planilhaPublicada +
      "/gviz/tq?gid=0&tqx=" +
      encodeURIComponent("out:json;responseHandler:" + callbackName);

    document.body.appendChild(script);
  });
</script>
